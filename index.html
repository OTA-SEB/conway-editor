<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151e">
<title>Conway Studio ∞</title>
<style>
:root{color-scheme:dark;--bg:#10151e;--panel:#1b2330;--border:#354257;--text:#edf3fb;--muted:#aab8cb;--accent:#65d9b9}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#28574f 0,transparent 48%),var(--bg);color:var(--text);font:15px system-ui,sans-serif}
main{width:min(1050px,100%);margin:auto;padding:clamp(20px,5vw,56px) clamp(16px,4vw,32px)}
.hero{padding:clamp(24px,5vw,52px);border:1px solid #3d5960;border-radius:24px;background:linear-gradient(135deg,#1e3539dd,#1b2330ee);box-shadow:0 22px 70px #0005}
.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
h1{font-size:clamp(32px,7vw,58px);line-height:1.04;margin:12px 0}
p{color:var(--muted);line-height:1.6}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
button,a{font:inherit}
button,.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:11px 16px;border-radius:12px;border:1px solid var(--border);background:#293445;color:var(--text);text-decoration:none;cursor:pointer;font-weight:650;transition:.15s}
button:hover,.button:hover{background:#39485d;border-color:#71849e}
.primary{background:linear-gradient(180deg,#318b78,#24695c);border-color:#65d9b9}
.primary:hover{background:#369b85}
section{margin-top:34px}
.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
h2{font-size:20px;margin:0}
#maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px;margin-top:15px}
.map{padding:16px;border:1px solid var(--border);border-radius:16px;background:#1b2330}
.map h3{margin:0 0 6px;overflow-wrap:anywhere}
.map small{color:var(--muted)}
.mapActions{display:flex;gap:8px;margin-top:14px}
.mapActions button{flex:1;min-width:0;padding:9px}
.danger{color:#ffaaa8}
.empty{padding:22px;border:1px dashed #47566b;border-radius:14px;color:var(--muted);text-align:center}
footer{margin-top:40px;color:#7f8da1;font-size:12px}
@media(max-width:560px){.actions>*{flex:1 1 100%}.sectionHead{align-items:flex-start;flex-direction:column}.mapActions button{min-height:44px}}
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="eyebrow">Un pequeño universo de células</div>
    <h1>Conway Studio <span style="color:#65d9b9">∞</span></h1>
    <p>Dibuja, experimenta y observa cómo evolucionan tus patrones. Tus mapas guardados permanecen en este navegador.</p>
    <div class="actions">
      <a class="button primary" href="./editor.html">＋ Abrir editor</a>
      <a class="button" href="./pixelizer.html">🖼️ Convertir imagen</a>
    </div>
  </div>
  <section>
    <div class="sectionHead"><h2>Mis mapas</h2><button id="refresh">↻ Actualizar</button></div>
    <div id="maps"></div>
  </section>
  <footer>Conway Studio · Los mapas se guardan localmente en este dispositivo, no en un servidor.</footer>
</main>
<script>
(()=>{
"use strict";
const KEY="conway:saved-maps";
const root=document.getElementById("maps");
function getMaps(){try{const value=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(value)?value:[];}catch{return [];}}
function render(){
  root.replaceChildren();
  const maps=getMaps();
  if(!maps.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Todavía no hay mapas guardados. Abre el editor y pulsa «Guardar mapa» para crear el primero.";root.append(empty);return;}
  for(const map of maps){
    const card=document.createElement("article");card.className="map";
    const title=document.createElement("h3");title.textContent=map.name||"Mapa sin nombre";
    const info=document.createElement("small");info.textContent=(Array.isArray(map.cells)?map.cells.length:0)+" células · "+(map.updatedAt?new Date(map.updatedAt).toLocaleString():"Fecha desconocida");
    const actions=document.createElement("div");actions.className="mapActions";
    const open=document.createElement("button");open.className="primary";open.textContent="Abrir";
    open.addEventListener("click",()=>{
      try{localStorage.setItem("conway:pending-saved-map",JSON.stringify(map));location.href="./editor.html";}
      catch{alert("No se pudo preparar este mapa para abrirlo.");}
    });
    const remove=document.createElement("button");remove.className="danger";remove.textContent="Eliminar";
    remove.addEventListener("click",()=>{
      if(!confirm("¿Eliminar «"+(map.name||"Mapa sin nombre")+"»?"))return;
      localStorage.setItem(KEY,JSON.stringify(getMaps().filter(item=>item.id!==map.id)));render();
    });
    actions.append(open,remove);card.append(title,info,actions);root.append(card);
  }
}
document.getElementById("refresh").addEventListener("click",render);
render();
})();
</script>
</body>
</html>
